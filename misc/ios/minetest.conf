# Default minetest.conf for the matematicasuperpiatta iOS fork.
#
# This file is shipped inside the .app bundle (under path_share). On first
# launch, if path_user/minetest.conf does not exist, the app copies this
# file there so the user starts with preconfigured graphics, touch UI and
# accessibility defaults. Subsequent in-game changes are written to
# path_user only — this file is never modified at runtime.
#
# To refresh the defaults: launch the app on a simulator or device, tweak
# settings in-game, then export path_user/minetest.conf via
#     xcrun simctl get_app_container booted <bundle_id> data
# (simulator) or Xcode → "Devices and Simulators" → Download Container
# (device), and replace this file in the repo.

# --- Graphics / rendering ---
enable_fog = true
viewing_range = 75
# Luanti 5.16 renamed opaque_water -> translucent_liquids (true = see-through).
translucent_liquids = true
node_highlighting = halo
selectionbox_color = (255,255,255)
selectionbox_width = 16
enable_3d_clouds = false
enable_shaders = false

# --- Movement / controls ---
fast_move = false
free_move = false
noclip = false
mouse_sensitivity = 0.08

# --- Touch / virtual controls ---
# Time a finger must rest before digging starts. ms_mac used a hardcoded
# MIN_DIG_TIME_MS=200; in Luanti 5.16 this is the touch_long_tap_delay
# setting (default 400). Lower it to 200 for snappier digging.
touch_long_tap_delay = 200
# Force touch controls on (iOS is always touch).
touch_gui = true
# Auto-jump onto single blocks by default.
autojump = true
# Camera look sensitivity for touch dragging. Lowered from the 0.2 default
# (x2/3) for finer aiming.
touchscreen_sensitivity = 0.1333
# Virtual-button layout (captured from an in-game arrangement of the controls).
touch_layout = {"layout":{"dig":{"offset_x":-2.0,"offset_y":-2.75,"position_x":1.0,"position_y":1.0},"drop":{"offset_x":-1.8,"offset_y":0.69871795177459717,"position_x":1.0,"position_y":0.0},"inventory":{"offset_x":-0.70512819290161133,"offset_y":1.7756410837173462,"position_x":1.0,"position_y":0.0},"jump":{"offset_x":-0.75,"offset_y":-1.5,"position_x":1.0,"position_y":1.0},"overflow":{"offset_x":-0.69230771064758301,"offset_y":0.69871795177459717,"position_x":1.0,"position_y":0.0},"place":{"offset_x":-2.0,"offset_y":-4.25,"position_x":1.0,"position_y":1.0},"sneak":{"offset_x":-0.75,"offset_y":-0.5,"position_x":1.0,"position_y":1.0}},"version":1}

# --- Memory (mobile) ---
# iPhones jetsam-kill apps that use too much RAM. Cap client map memory and
# unload unused data sooner to avoid OOM while loading content-heavy worlds.
client_mapblock_limit = 4000
client_unload_unused_data_timeout = 120
# Cap the transient image cache held during node-def texture init
# (fillNodeVisuals). Measured peak was ~1.66 GB freed only at end of the phase;
# this bounds it (flush+regenerate when exceeded) to avoid the OOM at the cap.
image_cache_budget_mb = 256

# iOS is always native fullscreen: don't persist screen_w/h (the drawable pixel
# size), which on restart would collapse the retina scale and shrink all text.
autosave_screensize = false

# --- Accessibility ---
gui_scaling = 1.0
hud_scaling = 0.5
font_size = 8
# Start with the on-screen debug info hidden (least invasive). Without this,
# show_debug defaults to true and the minimal debug HUD shows on join.
show_debug = false

# --- Game ---
default_game = matematicasuperpiatta
menu_last_game = matematicasuperpiatta
gameid = matematicasuperpiatta
address = 18.102.39.36 # default ip
remote_port = 30001 # default port
name = test # default name
maintab_LAST = online

# --- Matematica Superpiatta main menu + backend ---
# Load the custom MS main menu (resolved relative to builtin/ by init.lua).
main_menu_script = ms-mainmenu/init.lua
# Service discovery (AWS Lambda) and WISCOMS auth endpoints. The _local
# variants are HTTP fallbacks for demo accounts (need ATS local networking).
ms_discovery = fvqyugucy1.execute-api.eu-south-1.amazonaws.com/release
ms_discovery_local = 192.168.0.4
wiscoms_url = https://wiscoms.matematicasuperpiatta.it/wiscom
wiscoms_url_local = http://192.168.0.4:8000/wiscom